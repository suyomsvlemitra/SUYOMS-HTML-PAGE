<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eKYC Status Poster Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#F16522',
                            header: '#FDF1E7',
                            greypill: '#e8ecef',
                            green: '#10b981',
                            blue: '#001AFF',
                            teal: '#0A8B8B',
                            magenta: '#C2007D',
                            black: '#000000'
                        }
                    },
                    fontFamily: {
                        monospace: ['"Courier Prime"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                        devanagari: ['"Noto Sans Devanagari"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* A4 Page Dimensions ratio preview */
        .a4-container {
            width: 210mm;
            height: 297mm;
            box-sizing: border-box;
            background: white;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Perfectly Sharp Square Swatch Style */
        .theme-square {
            width: 16px;
            height: 16px;
            border-radius: 0px !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Print: isolate the poster and keep the A4 layout independent of screen theme */
        @media print {
            @page { size: A4 portrait; margin: 0; }

            html, body {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body * {
                visibility: hidden !important;
            }

            .a4-container,
            .a4-container * {
                visibility: visible !important;
            }

            body > header,
            .no-print,
            .print-area > :not(.a4-container) {
                display: none !important;
            }

            body > div {
                display: block !important;
                width: 210mm !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .print-area {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            .a4-container {
                display: flex !important;
                position: relative !important;
                width: 210mm !important;
                min-width: 210mm !important;
                max-width: 210mm !important;
                height: 297mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                box-shadow: none !important;
                overflow: hidden !important;
                background: #ffffff !important;
                box-sizing: border-box !important;
                page-break-after: avoid !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            /* Preserve the poster's own colors; prevent surrounding theme/background bleed */
            .a4-container,
            .a4-container * {
                box-sizing: border-box;
            }

            .a4-container .bg-white { background-color: #ffffff !important; }
            .a4-container .bg-\\[\\#FDF1E7\\] { background-color: #FDF1E7 !important; }
            .a4-container .bg-\\[\\#F16522\\] { background-color: #F16522 !important; }
            .a4-container .bg-\\[\\#10b981\\] { background-color: #10b981 !important; }
            .a4-container .bg-\\[\\#e8ecef\\] { background-color: #e8ecef !important; }
            .a4-container .bg-\\[\\#001AFF\\] { background-color: #001AFF !important; }
            .a4-container .bg-\\[\\#0A8B8B\\] { background-color: #0A8B8B !important; }
            .a4-container .bg-\\[\\#C2007D\\] { background-color: #C2007D !important; }
            .a4-container .bg-\\[\\#000000\\] { background-color: #000000 !important; }

            .a4-container .shadow-sm,
            .a4-container .shadow-md,
            .a4-container .shadow-lg {
                box-shadow: none !important;
            }

            .a4-container button {
                -webkit-appearance: none !important;
                appearance: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Top Header Navigation (Screen Only) -->
    <header class="bg-white border-b border-gray-200 py-3 px-6 no-print shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-id-card text-[#F16522] text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-800 font-devanagari">eKYC सर्टिफिकेट / पोस्टर जनरेटर टूल</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-rotate-right"></i> रीसेट (Reset)
                </button>
                <button onclick="window.print()" class="bg-[#F16522] hover:bg-orange-700 text-white px-5 py-2 rounded-lg font-semibold flex items-center gap-2 shadow-md transition">
                    <i class="fa-solid fa-print"></i> प्रिंट / Save PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Split-Screen Layout Container -->
    <div class="max-w-[1600px] mx-auto p-4 md:p-6 flex flex-col lg:flex-row gap-6">

        <!-- Left Panel: Input Form -->
        <div class="w-full lg:w-1/3 no-print">
            <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200 sticky top-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b flex items-center gap-2 font-devanagari">
                    <i class="fa-solid fa-pen-to-square text-[#F16522]"></i> माहिती भरा (Input Form)
                </h2>

                <form onsubmit="event.preventDefault();" class="space-y-5">
                    <!-- 1. Full Name -->
                    <div>
                        <label for="inputName" class="block text-sm font-semibold text-gray-700 mb-1 font-devanagari">
                            १. पूर्ण नाव (Full Name)
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="inputName" 
                                class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none uppercase font-semibold text-gray-800 text-sm"
                                value="FULL MANE" 
                                placeholder="नाव प्रविष्ट करा..."
                                oninput="updatePoster()">
                        </div>
                    </div>

                    <!-- 2. Last Update Date -->
                    <div>
                        <label for="inputLastDate" class="block text-sm font-semibold text-gray-700 mb-1 font-devanagari">
                            २. लास्ट अपडेट तारीख (Last Update Date)
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fa-solid fa-calendar-check"></i>
                            </span>
                            <input type="text" id="inputLastDate" 
                                class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none font-medium text-gray-800 text-sm"
                                value="20/10/2026" 
                                placeholder="DD/MM/YYYY"
                                oninput="updatePoster()">
                        </div>
                    </div>

                    <!-- 3. Next Update Date -->
                    <div>
                        <label for="inputNextDate" class="block text-sm font-semibold text-gray-700 mb-1 font-devanagari">
                            ३. नेक्स्ट अपडेट तारीख (Next Update Date)
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fa-solid fa-calendar-plus"></i>
                            </span>
                            <input type="text" id="inputNextDate" 
                                class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none font-medium text-gray-800 text-sm"
                                value="20/04/2027" 
                                placeholder="DD/MM/YYYY"
                                oninput="updatePoster()">
                        </div>
                    </div>

                    <!-- Buttons Row -->
                    <div class="pt-4 flex gap-3">
                        <button onclick="window.print()" type="button" 
                            class="flex-1 bg-[#F16522] hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 font-devanagari text-sm">
                            <i class="fa-solid fa-file-pdf text-lg"></i> Print / Save PDF
                        </button>
                        <button onclick="resetForm()" type="button" 
                            class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl border border-gray-300 transition flex items-center justify-center gap-1 font-devanagari text-sm">
                            <i class="fa-solid fa-rotate-right"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Panel: Live A4 Portrait Preview Container -->
        <div class="w-full lg:w-2/3 flex justify-center print-area overflow-x-auto">
            
            <!-- A4 Vertical Container (210mm x 297mm) -->
            <div class="a4-container border border-gray-300 bg-white text-gray-800">
                
                <!-- TOP HEADER BAR -->
                <div class="bg-[#FDF1E7] py-2 px-5 flex items-center justify-between border-b border-orange-100">
                    
                    <!-- Left Side: Government of Maharashtra Logo & Text -->
                    <div class="flex items-center space-x-2">
                        <div class="w-7 h-7 flex items-center justify-center">
                            <img src="https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/mh%20gov%20logo.PNG" 
                                 alt="Government of Maharashtra Seal" 
                                 class="max-w-full max-h-full object-contain"
                                 onerror="this.onerror=null; this.src='https://placehold.co/40x40/f16522/ffffff?text=MH';">
                        </div>
                        <span class="font-bold text-[13px] text-gray-900 tracking-tight">Government of Maharashtra</span>
                    </div>

                    <!-- Center: National Emblem Logo -->
                    <div class="flex flex-col items-center">
                        <div class="w-5 h-6 flex items-center justify-center">
                            <img src="https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/56656.png" 
                                 alt="National Emblem" 
                                 class="max-w-full max-h-full object-contain"
                                 onerror="this.onerror=null; this.src='https://placehold.co/30x40/333333/ffffff?text=Emblem';">
                        </div>
                        <span class="text-[6.5px] font-bold tracking-widest text-gray-800 uppercase mt-0.5">सत्यमेव जयते</span>
                    </div>

                    <!-- Right Side: Accessibility & Theme Squares -->
                    <div class="flex items-center space-x-2">
                        <!-- Accessibility Controls (- Aa +) -->
                        <div class="flex items-center text-[10px] text-gray-600 bg-white/80 px-1.5 py-0.5 border border-gray-300">
                            <span>-</span>
                            <span class="mx-1 font-semibold">Aa</span>
                            <span>+</span>
                        </div>
                        
                        <!-- Language Dropdown -->
                        <div class="flex items-center text-[10px] text-gray-700 bg-white/80 px-1.5 py-0.5 border border-gray-300">
                            <span class="mr-1">A/अ</span>
                            <span>English</span>
                            <i class="fa-solid fa-caret-down text-[8px] ml-1"></i>
                        </div>

                        <!-- 5 Square Theme Swatches -->
                        <div class="flex items-center space-x-1 pl-1">
                            <span class="text-[10px] text-gray-600 mr-0.5">Theme</span>
                            
                            <!-- Orange Square with Checkmark -->
                            <div class="theme-square bg-[#F16522] text-white text-[9px] font-bold border border-[#F16522]">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            
                            <!-- Blue Square -->
                            <div class="theme-square bg-[#001AFF] border border-[#001AFF]"></div>
                            
                            <!-- Dark Cyan Square -->
                            <div class="theme-square bg-[#0A8B8B] border border-[#0A8B8B]"></div>
                            
                            <!-- Magenta Square -->
                            <div class="theme-square bg-[#C2007D] border border-[#C2007D]"></div>
                            
                            <!-- Black Square -->
                            <div class="theme-square bg-[#000000] border border-[#000000]"></div>
                        </div>
                    </div>
                </div>

                <!-- MAIN POSTER CONTENT AREA (GAP CLEARED - MINIMAL TOP MARGIN) -->
                <div class="px-8 pt-5 pb-4 flex-1 flex flex-col items-center">

                    <!-- Dynamic Name Display (Just below Header) -->
                    <div class="text-center mb-6 w-full">
                        <div class="text-2xl font-bold tracking-wider font-monospace text-black uppercase flex justify-center items-center gap-3">
                            <span>NAME</span>
                            <span>:</span>
                            <span id="displayName">FULL NAME</span>
                        </div>
                    </div>

                    <!-- White Rounded Card Container -->
                    <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-3xl p-8 shadow-sm">
                        
                        <!-- 3 Step Indicators -->
                        <div class="grid grid-cols-3 gap-4 mb-10 relative">
                            <!-- Step 1 -->
                            <div class="flex flex-col items-center">
                                <div class="w-full flex items-center justify-center relative mb-2.5">
                                    <div class="absolute inset-0 flex items-center">
                                        <div class="h-[2px] w-full bg-[#F16522]"></div>
                                    </div>
                                    <div class="w-7 h-7 rounded-full bg-[#F16522] text-white flex items-center justify-center text-xs font-bold relative z-10 shadow-sm">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </div>
                                <span class="text-xs font-semibold text-gray-800 text-center">Validity Check</span>
                            </div>

                            <!-- Step 2 -->
                            <div class="flex flex-col items-center">
                                <div class="w-full flex items-center justify-center relative mb-2.5">
                                    <div class="absolute inset-0 flex items-center">
                                        <div class="h-[2px] w-full bg-[#F16522]"></div>
                                    </div>
                                    <div class="w-7 h-7 rounded-full bg-[#F16522] text-white flex items-center justify-center text-xs font-bold relative z-10 shadow-sm">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </div>
                                <span class="text-xs font-semibold text-gray-800 text-center">Aadhaar/VID Verification</span>
                            </div>

                            <!-- Step 3 -->
                            <div class="flex flex-col items-center">
                                <div class="w-full flex items-center justify-center relative mb-2.5">
                                    <div class="absolute inset-0 flex items-center">
                                        <div class="h-[2px] w-full bg-[#F16522]"></div>
                                    </div>
                                    <div class="w-7 h-7 rounded-full bg-[#F16522] text-white flex items-center justify-center text-xs font-bold relative z-10 shadow-sm">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </div>
                                <span class="text-xs font-semibold text-gray-800 text-center">OTP Verification</span>
                            </div>
                        </div>

                        <!-- Central Success Message Box -->
                        <div class="flex flex-col items-center text-center my-2">
                            <!-- Green Circular Checkmark Icon -->
                            <div class="w-16 h-16 rounded-full bg-[#10b981] text-white flex items-center justify-center text-3xl mb-4 shadow-sm">
                                <i class="fa-solid fa-check"></i>
                            </div>

                            <!-- Main Title -->
                            <h2 class="text-2xl font-bold text-gray-900 mb-6 tracking-tight">
                                eKYC Successfully Completed.
                            </h2>

                            <!-- Rounded Grey Pill Box -->
                            <div class="bg-[#e8ecef] text-gray-800 px-6 py-2 rounded-xl text-sm font-semibold mb-3 inline-block">
                                Last Updated : <span id="displayLastDate">20/10/2026</span>
                            </div>

                            <!-- Next Mandatory Update Date -->
                            <p class="text-xs font-medium text-gray-700 mb-8">
                                Next Mandatory Update : <span id="displayNextDate">20/04/2027</span>
                            </p>

                            <!-- Okay Orange Button -->
                            <button class="bg-[#F16522] text-white px-10 py-2 rounded-lg text-sm font-medium shadow-sm pointer-events-none">
                                Okay
                            </button>
                        </div>

                    </div>

                </div>

                <!-- Bottom Right Accessibility Figure Icon -->
                <div class="w-full flex justify-end p-6">
                    <div class="w-10 h-10 bg-[#F16522] rounded-full flex items-center justify-center text-white text-lg shadow-md">
                        <i class="fa-solid fa-universal-access"></i>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Live Reactive JS Script -->
    <script>
        function updatePoster() {
            const nameVal = document.getElementById('inputName').value.trim();
            const lastDateVal = document.getElementById('inputLastDate').value.trim();
            const nextDateVal = document.getElementById('inputNextDate').value.trim();

            document.getElementById('displayName').innerText = nameVal ? nameVal.toUpperCase() : '----------------';
            document.getElementById('displayLastDate').innerText = lastDateVal ? lastDateVal : 'DD/MM/YYYY';
            document.getElementById('displayNextDate').innerText = nextDateVal ? nextDateVal : 'DD/MM/YYYY';
        }

        function resetForm() {
            document.getElementById('inputName').value = 'FULL NAME';
            document.getElementById('inputLastDate').value = '20/10/2026';
            document.getElementById('inputNextDate').value = '20/04/2027';
            updatePoster();
        }

        // Initialize on load
        window.onload = function() {
            updatePoster();
        };
    </script>
</body>
</html>
