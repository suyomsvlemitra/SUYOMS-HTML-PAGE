<!-- SMART SUYOMS PRINT TOOL - BLOGGER WIDGET WITH DIRECT FIREBASE REALTIME SYNC -->
<!-- हा कोड तुमच्या ब्लॉगरच्या ग्राहक अपलोड पेजमध्ये (Pages -> New Page -> HTML view) पेस्ट करा -->

<div id="sp-blogger-root" style="all: initial; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
#sp-blogger-root * { box-sizing: border-box; margin: 0; padding: 0; }
#sp-blogger-root {
    display: block;
    background: #09090d;
    color: #ffffff;
    min-height: 100vh;
    padding: 20px 14px 40px;
}
#sp-blogger-root .sp-container {
    max-width: 580px;
    margin: 0 auto;
}
#sp-blogger-root .sp-header {
    background: #0f0f16;
    border: 2px solid #f95700;
    border-radius: 16px;
    padding: 18px 20px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
#sp-blogger-root .sp-title {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
#sp-blogger-root .sp-title span {
    color: #f95700;
}
#sp-blogger-root .sp-user-badge {
    display: inline-block;
    background: rgba(249, 87, 0, 0.15);
    border: 1.5px solid #f95700;
    color: #ff8c00;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
}
#sp-blogger-root .sp-card {
    background: #121218;
    border: 1.5px solid #262636;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#sp-blogger-root .sp-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #ff8c00;
    margin-bottom: 6px;
}
#sp-blogger-root .sp-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #262636;
    border-radius: 10px;
    background: #07070a;
    color: #ffffff;
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
}
#sp-blogger-root .sp-input:focus {
    border-color: #f95700;
    box-shadow: 0 0 0 3px rgba(249, 87, 0, 0.25);
}
#sp-blogger-root .sp-dropzone {
    border: 2px dashed #f95700;
    background: rgba(249, 87, 0, 0.05);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 16px;
}
#sp-blogger-root .sp-dropzone:hover {
    background: rgba(249, 87, 0, 0.12);
}
#sp-blogger-root .sp-file-item {
    background: #08080c;
    border: 1px solid #262636;
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 8px;
}
#sp-blogger-root .sp-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}
#sp-blogger-root .sp-pills {
    display: flex;
    background: #07070a;
    border: 1.5px solid #262636;
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
}
#sp-blogger-root .sp-pill-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #a1a1aa;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
}
#sp-blogger-root .sp-pill-btn.active {
    background: #f95700;
    color: #ffffff;
}
#sp-blogger-root .sp-btn-submit {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #f95700, #ff6f1a);
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(249, 87, 0, 0.4);
    transition: all 0.2s;
}
#sp-blogger-root .sp-btn-submit:hover:not(:disabled) {
    background: linear-gradient(135deg, #ff6f1a, #c03d00);
}
#sp-blogger-root .sp-btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
#sp-blogger-root .sp-token-box {
    background: #07070a;
    border: 2px solid #f95700;
    border-radius: 14px;
    padding: 22px;
    text-align: center;
    margin: 20px 0;
}
#sp-blogger-root .sp-token-num {
    font-size: 46px;
    font-weight: 900;
    color: #ff8c00;
}
</style>

<div class="sp-container">
    <!-- HEADER -->
    <div class="sp-header">
        <div class="sp-title">
            <span>⚡</span> स्मार्ट प्रिंट व झेरॉक्स पोर्टल
        </div>
        <div class="sp-user-badge" id="spUserBadge">
            👤 लॉगिन युजर: <span id="spLoggedUserName">ग्राहक / युजर</span>
        </div>
    </div>

    <!-- UPLOAD FORM -->
    <div class="sp-card" id="spFormCard">
        <form id="spBloggerForm" onsubmit="spHandleSubmit(event)">
            <div>
                <label class="sp-label">तुमचे नाव (Customer Name) *</label>
                <input type="text" id="spCustName" class="sp-input" placeholder="उदा. राहुल पवार" required>
            </div>

            <div>
                <label class="sp-label">मोबाईल नंबर (WhatsApp Number)</label>
                <input type="tel" id="spCustPhone" class="sp-input" placeholder="उदा. 9876543210" maxlength="10">
            </div>

            <div>
                <label class="sp-label">डॉक्युमेंट / फाईल निवडा (PDF, Image, Doc) *</label>
                <div class="sp-dropzone" onclick="document.getElementById('spFileInput').click()">
                    <div style="font-size: 36px; color:#f95700; margin-bottom: 6px;">📂</div>
                    <div style="font-weight: 800; font-size: 15px;">येथे टच करून फाईल निवडा</div>
                    <div style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">PDF, Photos, JPG, PNG, DOCX</div>
                    <input type="file" id="spFileInput" multiple accept="image/*,.pdf,.doc,.docx" style="display:none;" onchange="spFilesPicked(this)">
                </div>
                <div id="spFileList"></div>
            </div>

            <div class="sp-grid-2">
                <div>
                    <label class="sp-label">प्रती (Copies)</label>
                    <input type="number" id="spCopies" class="sp-input" value="1" min="1" max="50">
                </div>

                <div>
                    <label class="sp-label">कलर प्रकार (Color)</label>
                    <div class="sp-pills">
                        <button type="button" class="sp-pill-btn active" id="spBtnBw" onclick="spSetColor('bw')">B & W</button>
                        <button type="button" class="sp-pill-btn" id="spBtnCol" onclick="spSetColor('color')">🎨 Color</button>
                    </div>
                </div>
            </div>

            <button type="submit" id="spSubmitBtn" class="sp-btn-submit">
                🖨️ प्रिंटसाठी काउंटरला पाठवा
            </button>
            <div id="spStatusText" style="text-align:center; font-size:12px; color:#ff8c00; margin-top:8px; display:none;">
                क्लाउडवर अपलोड होत आहे... कृपया थांबा...
            </div>
        </form>
    </div>

    <!-- SUCCESS TOKEN CARD -->
    <div class="sp-card" id="spSuccessCard" style="display:none; text-align:center;">
        <div style="font-size: 44px; color:#4ade80; margin-bottom: 10px;">✅</div>
        <h2 style="font-size: 22px; font-weight: 800; color: #ffffff;">फाईल यशस्वीरीत्या पाठवली!</h2>
        <p style="font-size: 13px; color: #a1a1aa; margin-top: 4px;">तुमचा टोकन नंबर खालीलप्रमाणे आहे:</p>

        <div class="sp-token-box">
            <div style="font-size: 12px; color: #a1a1aa; text-transform:uppercase;">Token Number</div>
            <div class="sp-token-num" id="spDisplayToken">#101</div>
            <div style="font-size: 13px; color: #ff8c00; font-weight:700; margin-top:8px;">
                हा टोकन नंबर काउंटरवर सांगा किंवा दाखवा!
            </div>
        </div>

        <button type="button" class="sp-btn-submit" style="background:#262636; border:1.5px solid #f95700;" onclick="spResetForm()">
            + अजून फाईल पाठवा
        </button>
    </div>
</div>

<script>
(function() {
    // Exact User Firebase Config
    const fbConfig = {
        apiKey: "AIzaSyDOYUIvE7yWCNEf_K6dHEGfEqtUwLy3rdM",
        authDomain: "suyoms-login.firebaseapp.com",
        databaseURL: "https://suyoms-login-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "suyoms-login",
        storageBucket: "suyoms-login.firebasestorage.app",
        messagingSenderId: "1084425019811",
        appId: "1:1084425019811:web:f036c2b42cb5eb4ee5ba16",
        measurementId: "G-M5D0GP7DBD"
    };

    let fbApp = null;
    let fbDb = null;

    function initFirebase() {
        if (!window.firebase) return;
        try {
            fbApp = firebase.app();
        } catch(e) {
            fbApp = firebase.initializeApp(fbConfig);
        }
        fbDb = firebase.database();
    }

    let spFiles = [];
    let spColorMode = 'bw';

    window.addEventListener('DOMContentLoaded', () => {
        initFirebase();
        spDetectUser();
    });
    setTimeout(() => { initFirebase(); spDetectUser(); }, 500);

    function spDetectUser() {
        let detectedName = '';
        if (window.firebase && firebase.auth && firebase.auth().currentUser) {
            const u = firebase.auth().currentUser;
            detectedName = u.displayName || u.email || '';
        }
        if (!detectedName) {
            detectedName = localStorage.getItem('user_name') || localStorage.getItem('username') || localStorage.getItem('loggedInUser') || '';
        }
        if (!detectedName) {
            const bloggerProfile = document.querySelector('.user .profile-name, #comments .author');
            if (bloggerProfile) detectedName = bloggerProfile.innerText.trim();
        }

        if (detectedName) {
            document.getElementById('spLoggedUserName').innerText = detectedName;
            document.getElementById('spCustName').value = detectedName;
        }
    }

    window.spSetColor = function(mode) {
        spColorMode = mode;
        document.getElementById('spBtnBw').className = 'sp-pill-btn ' + (mode === 'bw' ? 'active' : '');
        document.getElementById('spBtnCol').className = 'sp-pill-btn ' + (mode === 'color' ? 'active' : '');
    };

    window.spFilesPicked = function(input) {
        if (!input.files) return;
        spFiles = Array.from(input.files);
        const list = document.getElementById('spFileList');
        list.innerHTML = spFiles.map(f => `
            <div class="sp-file-item">
                <span>📄 ${f.name}</span>
                <span style="color:#ff8c00; font-weight:bold;">${(f.size/1024).toFixed(1)} KB</span>
            </div>
        `).join('');
    };

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    window.spHandleSubmit = async function(e) {
        e.preventDefault();
        if (spFiles.length === 0) {
            alert('कृपया किमान एक फाईल निवडा!');
            return;
        }

        const btn = document.getElementById('spSubmitBtn');
        const statusText = document.getElementById('spStatusText');
        btn.disabled = true;
        btn.innerText = 'अपलोड होत आहे... (Sending)';
        statusText.style.display = 'block';

        const name = document.getElementById('spCustName').value.trim();
        const phone = document.getElementById('spCustPhone').value.trim();
        const copies = parseInt(document.getElementById('spCopies').value) || 1;
        const tokenNum = Math.floor(100 + Math.random() * 900);
        const customerId = 'cust_' + Date.now();

        // Convert files for Firebase storage
        const preparedFiles = [];
        for (let i = 0; i < spFiles.length; i++) {
            const f = spFiles[i];
            let base64 = '';
            if (f.size < 5 * 1024 * 1024) {
                try { base64 = await fileToBase64(f); } catch(err){}
            }
            preparedFiles.push({
                id: 'f_' + Date.now() + '_' + i,
                name: f.name,
                size: f.size,
                type: f.name.split('.').pop() || 'doc',
                dataUrl: base64
            });
        }

        const payload = {
            id: customerId,
            token_number: tokenNum,
            customer_name: name,
            phone: phone,
            copies: copies,
            color_mode: spColorMode,
            pages: 'All',
            createdAt: Date.now(),
            status: 'pending',
            files: preparedFiles
        };

        // 1. Direct Firebase Realtime DB push
        initFirebase();
        if (fbDb) {
            try {
                await fbDb.ref('print_queue/' + customerId).set(payload);
                console.log('Firebase Realtime push success:', customerId);
            } catch(fbErr) {
                console.warn('Firebase push error:', fbErr);
            }
        }

        // 2. BroadcastChannel fallback for same device
        try {
            const channel = new BroadcastChannel('smart_print_channel');
            channel.postMessage({ type: 'NEW_CUSTOMER_UPLOAD', customer_name: name, token: tokenNum });
        } catch(err) {}

        // Show Token Screen
        document.getElementById('spFormCard').style.display = 'none';
        document.getElementById('spSuccessCard').style.display = 'block';
        document.getElementById('spDisplayToken').innerText = '#' + tokenNum;
        btn.disabled = false;
        btn.innerText = '🖨️ प्रिंटसाठी काउंटरला पाठवा';
        statusText.style.display = 'none';
    };

    window.spResetForm = function() {
        spFiles = [];
        document.getElementById('spBloggerForm').reset();
        document.getElementById('spFileList').innerHTML = '';
        document.getElementById('spFormCard').style.display = 'block';
        document.getElementById('spSuccessCard').style.display = 'none';
        spDetectUser();
    };
})();
</script>
</div>
