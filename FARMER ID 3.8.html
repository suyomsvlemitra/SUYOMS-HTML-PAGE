    <style>

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }

            canvas { 
                width: 95mm !important;
                height: 60mm !important; 
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
    </style>

    <script>

    <script>
        let userPhotoImg = null;
        let assets = {};

        const FONT_DEVANAGARI = "'Noto Sans Devanagari', 'Arial', sans-serif";
        const FONT_SERIF = "'Times New Roman', 'Georgia', serif";
        const FONT_AWESOME = '"Font Awesome 6 Free", "FontAwesome"';

        const S = 2.0;

        function decodeText(text) {
            const txt = document.createElement('textarea');
            txt.innerHTML = text;
            return txt.value;
        }

        const assetUrls = {
            bgFront: "https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/Frint_site_image-transformed.png",
            bgBack: "https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/Back_Side-transformed.png",
            agriLogo: "https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/agri_stack_logo copy.png",
            mhGovLogo: "https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/mh gov logo.PNG",
            ashokStambh: "https://cdn.jsdelivr.net/gh/suyomsvlemitra/AI-Images@Suyoms-images/56656.png"
        };

        let landData = [
            { state: 'MH', dist: 'Jalgaon', subDist: 'Pachora', village: 'Pachora', sno: '102', ss: '4', area: '0.500' }
        ];

        function loadAssets(callback) {
            let loaded = 0;
            const keys = Object.keys(assetUrls);
            
            keys.forEach(key => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = assetUrls[key];
                
                img.onload = () => {
                    assets[key] = img;
                    loaded++;
                    renderCards();
                    if (loaded === keys.length && callback) callback();
                };
                
                img.onerror = () => {
                    loaded++;
                    renderCards();
                    if (loaded === keys.length && callback) callback();
                };
            });
        }

        function drawRoundedCardBorder(ctx, w, h, radius) {
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(w - radius, 0);
            ctx.quadraticCurveTo(w, 0, w, radius);
            ctx.lineTo(w, h - radius);
            ctx.quadraticCurveTo(w, h, w - radius, h);
            ctx.lineTo(radius, h);
            ctx.quadraticCurveTo(0, h, 0, h - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
        }

        function drawDottedCropBorder(ctx, w, h) {
            ctx.save();
            ctx.setLineDash([16 * S, 16 * S]);
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1.5 * S;
            drawRoundedCardBorder(ctx, w, h, 28 * S);
            ctx.stroke();
            ctx.restore();
        }

        function renderCards() {
            renderFrontCard();
            renderBackCard();
        }

        function drawRoundedRectPath(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function formatDOBForCard(dateString) {
            if (!dateString) return "";
            if (dateString.includes("-")) {
                const parts = dateString.split("-");
                if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateString;
        }

        function renderFrontCard() {
            const canvas = document.getElementById('canvas-front');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.save();
            drawRoundedCardBorder(ctx, w, h, 28 * S);
            ctx.clip();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);

            if (assets.bgFront) {
                ctx.save();
                ctx.globalAlpha = 0.28;
                ctx.drawImage(assets.bgFront, 0, 0, w, h);
                ctx.restore();
            }

            if (assets.agriLogo) ctx.drawImage(assets.agriLogo, 30 * S, 25 * S, 125 * S, 55 * S);
            if (assets.ashokStambh) ctx.drawImage(assets.ashokStambh, 895 * S, 15 * S, 60 * S, 80 * S);

            ctx.fillStyle = "#c2410c";
            ctx.font = `bold ${30 * S}px ${FONT_DEVANAGARI}`;
            ctx.textAlign = "center";
            ctx.fillText(decodeText("भारत सरकार"), w / 2, 42 * S);

            ctx.fillStyle = "#044e1b";
            ctx.font = `800 ${40 * S}px ${FONT_SERIF}`;
            ctx.fillText("Government of India", w / 2, 84 * S);

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2.5 * S;
            ctx.beginPath();
            ctx.moveTo(10 * S, 105 * S);
            ctx.lineTo(w - 10 * S, 105 * S);
            ctx.stroke();

            ctx.save();
            ctx.translate(22 * S, 330 * S);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = "#000000";
            ctx.font = `bold ${22 * S}px ${FONT_SERIF}`;
            ctx.textAlign = "center";
            const appDate = document.getElementById('in-approval-date').value;
            ctx.fillText(`Approval Date : ${appDate}`, 0, 0);
            ctx.restore();

            const px = 50 * S, py = 145 * S, pw = 220 * S, ph = 275 * S, borderRadius = 12 * S;

            ctx.save();
            ctx.save();
            drawRoundedRectPath(ctx, px, py, pw, ph, borderRadius);
            ctx.clip();

            if (userPhotoImg) {
                ctx.drawImage(userPhotoImg, px, py, pw, ph);
            } else {
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(px, py, pw, ph);
                ctx.fillStyle = "#64748b";
                ctx.font = `bold ${24 * S}px ${FONT_SERIF}`;
                ctx.textAlign = "center";
                ctx.fillText("PHOTO", px + (pw / 2), py + (ph / 2));
            }
            ctx.restore();

            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 2 * S;         
            drawRoundedRectPath(ctx, px, py, pw, ph, borderRadius);
            ctx.stroke();
            ctx.restore();

            ctx.textAlign = "left";
            const txLabel = 295 * S;
            const txValue = 460 * S;
            let ty = 175 * S; // थोडे वर सरकवले जेवढे फिल्ड्स वाढले त्यानुसार
            const lineGap = 37 * S; // अंतर थोडे कमी केले जेवढे कार्डवर बसू शकेल

            const nameHn = decodeText(document.getElementById('in-name-hn').value);
            const nameEn = document.getElementById('in-name-en').value;
            const gender = document.getElementById('in-gender').value;
            const rawDob = document.getElementById('in-dob').value;
            const dob = formatDOBForCard(rawDob);
            const areaType = document.getElementById('in-area-type').value;
            const aadhaar = document.getElementById('in-aadhaar').value;
            const mobile = document.getElementById('in-mobile').value; // मोबाईल नंबर व्हॅल्यू
            const farmerId = document.getElementById('in-farmer-id').value;

            // मोबाईल नंबर फील्ड लिस्टमध्ये समाविष्ट केले आहे
            const fields = [
                { label: decodeText("नाव"), val: nameHn, fontLabel: `bold ${26 * S}px ${FONT_DEVANAGARI}`, fontVal: `bold ${26 * S}px ${FONT_DEVANAGARI}` },
                { label: "Name", val: nameEn, fontLabel: `bold ${25 * S}px ${FONT_SERIF}`, fontVal: `bold ${25 * S}px ${FONT_SERIF}` },
                { label: "Gender", val: gender, fontLabel: `bold ${24 * S}px ${FONT_SERIF}`, fontVal: `bold ${24 * S}px ${FONT_SERIF}` },
                { label: "DOB", val: dob, fontLabel: `bold ${24 * S}px ${FONT_SERIF}`, fontVal: `bold ${24 * S}px ${FONT_SERIF}` },
                { label: "Area", val: areaType, fontLabel: `bold ${24 * S}px ${FONT_SERIF}`, fontVal: `bold ${24 * S}px ${FONT_SERIF}` },
                { label: "Aadhaar", val: aadhaar, fontLabel: `bold ${24 * S}px ${FONT_SERIF}`, fontVal: `bold ${24 * S}px ${FONT_SERIF}` },
                { label: "Mobile", val: mobile, fontLabel: `bold ${24 * S}px ${FONT_SERIF}`, fontVal: `bold ${24 * S}px ${FONT_SERIF}` }
            ];

            fields.forEach(f => {
                ctx.fillStyle = "#000000";
                ctx.font = f.fontLabel;
                ctx.fillText(f.label, txLabel, ty);

                ctx.font = f.fontVal;
                ctx.fillText(f.val, txValue, ty);
                ty += lineGap;
            });

            try {
                const qx = 730 * S, qy = 280 * S, qw = 220 * S, qh = 220 * S;
                const qrCanvas = document.createElement('canvas');
                
                const qrDataText = `Farmer ID: ${farmerId}\nनाव (मराठी): ${nameHn}\nName (English): ${nameEn}\nलिंग (Gender): ${gender}\nजन्म तारीख (DOB): ${dob}\nक्षेत्र (Area): ${areaType}\nआधार: ${aadhaar}\nमोबाईल: ${mobile}\nसंपूर्ण पत्ता (Full Address): ${document.getElementById('in-address').value}`;
                
                new QRious({
                    element: qrCanvas,
                    size: 440,
                    value: qrDataText,
                    level: 'H'
                });
                ctx.drawImage(qrCanvas, qx, qy, qw, qh);
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 1.5 * S;
                ctx.strokeRect(qx, qy, qw, qh);
            } catch (e) {
                console.warn("QR Error:", e);
            }

            ctx.fillStyle = "#044e1b";
            ctx.font = `900 ${42 * S}px ${FONT_SERIF}`;
            ctx.textAlign = "center";
            ctx.fillText(`Farmer ID : ${farmerId}`, w / 2, h - (90 * S));

            ctx.strokeStyle = "#b45309";
            ctx.lineWidth = 6 * S;
            ctx.beginPath();
            ctx.moveTo(10 * S, h - (68 * S));
            ctx.lineTo(w - (10 * S), h - (68 * S));
            ctx.stroke();

            ctx.fillStyle = "#000000";
            ctx.font = `bold ${30 * S}px ${FONT_SERIF}`;
            ctx.textAlign = "center";
            ctx.fillText("Maharashtra Farmer Registry", w / 2, h - (20 * S));

            ctx.restore();
            drawDottedCropBorder(ctx, w, h);
        }

        function renderBackCard() {
            const canvas = document.getElementById('canvas-back');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.save();
            drawRoundedCardBorder(ctx, w, h, 28 * S);
            ctx.clip();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);

            if (assets.bgBack) {
                ctx.save();
                ctx.globalAlpha = 0.28;
                ctx.drawImage(assets.bgBack, 0, 0, w, h);
                ctx.restore();
            }

            if (assets.agriLogo) ctx.drawImage(assets.agriLogo, 30 * S, 25 * S, 125 * S, 55 * S);
            if (assets.mhGovLogo) ctx.drawImage(assets.mhGovLogo, 885 * S, 15 * S, 75 * S, 75 * S);

            ctx.fillStyle = "#c2410c";
            ctx.font = `bold ${28 * S}px ${FONT_DEVANAGARI}`;
            ctx.textAlign = "center";
            ctx.fillText(decodeText("कृषी व शेतकरी कल्याण मंत्रालय"), w / 2, 42 * S);

            ctx.fillStyle = "#044e1b";
            ctx.font = `800 ${34 * S}px ${FONT_SERIF}`;
            ctx.fillText("Ministry of Agri & Farmers Welfare", w / 2, 80 * S);

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2.5 * S;
            ctx.beginPath();
            ctx.moveTo(10 * S, 105 * S);
            ctx.lineTo(w - (10 * S), 105 * S);
            ctx.stroke();

            ctx.save();
            ctx.translate(22 * S, 330 * S);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = "#000000";
            ctx.font = `bold ${22 * S}px ${FONT_SERIF}`;
            ctx.textAlign = "center";
            const downDate = document.getElementById('in-download-date').value;
            ctx.fillText(`Download Date : ${downDate}`, 0, 0);
            ctx.restore();

            const address = decodeText(document.getElementById('in-address').value);
            ctx.textAlign = "left";
            ctx.font = `bold ${26 * S}px ${FONT_SERIF}`;
            ctx.fillStyle = "#000000";
            ctx.fillText("Address:", 60 * S, 138 * S);

            ctx.font = `bold ${24 * S}px ${FONT_SERIF}`;
            ctx.fillText(address, 60 * S, 168 * S);

            const startX = 50 * S;
            let startY = 205 * S;
            const tableW = 910 * S;
            const rowH = 52 * S;

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2 * S;

            const cols = [
                { title: "State", width: 100 * S },
                { title: "District", width: 140 * S },
                { title: "Sub Dist", width: 150 * S },
                { title: "Village", width: 180 * S },
                { title: "S.No", width: 110 * S },
                { title: "Khata", width: 110 * S },
                { title: "Area (Ha)", width: 120 * S }
            ];

            ctx.fillStyle = "#a7f3d0";
            ctx.fillRect(startX, startY, tableW, rowH);
            ctx.strokeRect(startX, startY, tableW, rowH);

            ctx.font = `bold ${24 * S}px ${FONT_SERIF}`;
            ctx.fillStyle = "#064e3b";
            let curX = startX;

            cols.forEach((col) => {
                ctx.textAlign = "center";
                ctx.fillText(col.title, curX + (col.width / 2), startY + (33 * S));
                curX += col.width;
            });

            curX = startX;
            cols.forEach((col) => {
                ctx.strokeRect(curX, startY, col.width, rowH);
                curX += col.width;
            });

            startY += rowH;
            ctx.font = `bold ${24 * S}px ${FONT_SERIF}`;

            landData.forEach((row) => {
                const vals = [row.state, row.dist, row.subDist, row.village, row.sno, row.ss, row.area];
                let cX = startX;

                vals.forEach((val, cIdx) => {
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(cX, startY, cols[cIdx].width, rowH);
                    ctx.strokeRect(cX, startY, cols[cIdx].width, rowH);

                    ctx.textAlign = "center";
                    ctx.fillStyle = "#000000";
                    ctx.fillText(val || '-', cX + (cols[cIdx].width / 2), startY + (33 * S));
                    cX += cols[cIdx].width;
                });
                startY += rowH;
            });

            ctx.fillStyle = "#b91c1c";
            ctx.font = `bold ${20 * S}px ${FONT_DEVANAGARI}`;
            ctx.textAlign = "center";
            ctx.fillText(decodeText("* टीप: हे कार्ड केवळ वैयक्तिक वापरासाठी आहे; हे सरकारी कार्ड नाही."), w / 2, 552 * S);

            ctx.strokeStyle = "#b45309";
            ctx.lineWidth = 6 * S;
            ctx.beginPath();
            ctx.moveTo(10 * S, h - (68 * S));
            ctx.lineTo(w - (10 * S), h - (68 * S));
            ctx.stroke();

            ctx.fillStyle = "#000000";
            ctx.font = `900 ${25 * S}px ${FONT_AWESOME}`;
            ctx.textAlign = "left";
            ctx.fillText("\uf095", 50 * S, h - (20 * S));
            
            ctx.font = `bold ${26 * S}px ${FONT_SERIF}`;
            ctx.fillText("020 25712712", 85 * S, h - (20 * S));

            ctx.font = `900 ${25 * S}px ${FONT_AWESOME}`;
            ctx.textAlign = "right";
            ctx.fillText("\uf0ac", 650 * S, h - (20 * S));

            ctx.font = `bold ${26 * S}px ${FONT_SERIF}`;
            ctx.textAlign = "right";
            ctx.fillText("www.mhfr.agristack.gov.in", 960 * S, h - (20 * S));

            ctx.restore();
            drawDottedCropBorder(ctx, w, h);
        }

        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        userPhotoImg = img;
                        document.getElementById('form-photo-img').src = evt.target.result;
                        document.getElementById('form-photo-img').classList.remove('hidden');
                        document.getElementById('form-photo-icon').classList.add('hidden');
                        renderCards();
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function renderLandInputs() {
            const container = document.getElementById('land-rows-container');
            if (!container) return;
            container.innerHTML = '';
            landData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-purple-100 text-[10px] hover:bg-purple-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-1"><input type="text" value="${item.state}" oninput="updateLandData(${index}, 'state', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1"><input type="text" value="${item.dist}" oninput="updateLandData(${index}, 'dist', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1"><input type="text" value="${item.subDist}" oninput="updateLandData(${index}, 'subDist', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1"><input type="text" value="${item.village}" oninput="updateLandData(${index}, 'village', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1"><input type="text" value="${item.sno}" oninput="updateLandData(${index}, 'sno', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1"><input type="text" value="${item.ss}" oninput="updateLandData(${index}, 'ss', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1"><input type="text" value="${item.area}" oninput="updateLandData(${index}, 'area', this.value)" class="w-full bg-white border border-purple-200 p-1 rounded text-slate-800 focus:border-purple-500 outline-none"></td>
                    <td class="p-1 text-center"><button onclick="removeLandRow(${index})" class="text-red-500 hover:text-red-700 font-bold bg-red-50 hover:bg-red-100 p-1.5 rounded transition-colors"><i class="fas fa-trash-alt"></i></button></td>
                `;
                container.appendChild(tr);
            });
            renderCards();
        }

        function addLandRow() {
            landData.push({ state: 'MH', dist: '', subDist: '', village: '', sno: '', ss: '', area: '' });
            renderLandInputs();
        }

        function removeLandRow(i) {
            landData.splice(i, 1);
            renderLandInputs();
        }

        function updateLandData(i, key, val) {
            landData[i][key] = val;
            renderCards();
        }

        function downloadImage(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4',
                compress: true
            });

            const frontCanvas = document.getElementById('canvas-front');
            const backCanvas = document.getElementById('canvas-back');

            const imgFront = frontCanvas.toDataURL('image/png', 1.0);
            const imgBack = backCanvas.toDataURL('image/png', 1.0);

            pdf.addImage(imgFront, 'PNG', 12, 20, 90, 56.8, undefined, 'FAST');
            pdf.addImage(imgBack, 'PNG', 108, 20, 90, 56.8, undefined, 'FAST');

            pdf.save('AgriStack_Smart_Card_Ultra_HD.pdf');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            const formattedDate = dd + '/' + mm + '/' + yyyy;
            
            document.getElementById('in-approval-date').value = formattedDate;
            document.getElementById('in-download-date').value = formattedDate;

            renderLandInputs();
            document.fonts.ready.then(() => {
                renderCards();
            });
            loadAssets();
        });
    </script>
</body>
</html>
